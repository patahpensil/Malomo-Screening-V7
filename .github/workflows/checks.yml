name: Pemeriksaan Malomo V7
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tes engine dan paritas skor M2
        run: npm test
      - name: Verifier PRD
        run: npm run test:prd
      - name: Paritas OHLCV 2024 (SKIP bila arsip belum ada)
        run: npm run parity:ohlcv

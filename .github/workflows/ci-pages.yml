name: Tes & Deploy Malomo V7
# Deploy ke GitHub Pages HANYA jika semua tes lulus: engine, paritas M2, aplikasi, verifier PRD, dan uji browser.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Tes engine, paritas M2, aplikasi, verifier PRD
        run: npm test
      - name: Paritas OHLCV 2024 (SKIP bila arsip belum ada)
        run: npm run parity:ohlcv
      - name: Susun situs
        run: npm run build
      - name: Pasang Chromium
        run: npx playwright install --with-deps chromium
      - name: Uji bug di browser (desktop + mobile, Binance di-mock)
        run: node scripts/test-browser.js
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4

name: Tes & Deploy Malomo V7
# Deploy ke GitHub Pages HANYA jika semua tes lulus: engine, paritas M2, aplikasi, verifier PRD, dan uji browser.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Tes engine, paritas M2, aplikasi, verifier PRD
        run: npm test
      - name: Unduh arsip kline resmi Binance 2024 (data.binance.vision, checksum resmi)
        run: node scripts/fetch-ohlcv-2024.js
      - name: Paritas penuh engine vs bukti 2024 dari candle asli
        if: ${{ !cancelled() }}
        run: npm run parity:ohlcv
      - name: Unduh kline 4H asli ±260 hari terakhir (data.binance.vision)
        if: ${{ !cancelled() }}
        run: node scripts/fetch-recent-archive.js
      - name: Siklus engine atas data Binance asli terbaru (arsip resmi)
        if: ${{ !cancelled() }}
        run: node scripts/live-check.js
        env:
          ARCHIVE_DIR: data/recent
      - name: Uji API Binance langsung (REST + WebSocket); dilewati bila server CI diblokir lokasi (HTTP 451)
        if: ${{ !cancelled() }}
        run: node scripts/live-check.js || [ $? -eq 3 ]
      - name: Susun situs
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Pasang Chromium
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
      - name: Uji bug di browser (desktop + mobile, skenario terkendali)
        if: ${{ !cancelled() }}
        run: node scripts/test-browser.js
      - name: Uji browser ujung-ke-ujung dengan data Binance asli terbaru (arsip resmi)
        if: ${{ !cancelled() }}
        run: node scripts/test-browser-live.js
        env:
          ARCHIVE_DIR: data/recent
      - name: Uji browser dengan API Binance langsung; dilewati bila server CI diblokir lokasi (HTTP 451)
        if: ${{ !cancelled() }}
        run: node scripts/test-browser-live.js || [ $? -eq 3 ]
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
